<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casper — ログイン</title>
<link rel="icon" type="image/jpeg" href="/icon">
<style>
  :root{ --bg:#0b0f17; --panel:#121826; --line:#1f2937; --txt:#e5e7eb; --mut:#94a3b8; --accent:#38bdf8; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(1200px 600px at 70% -10%,#10233a 0%,var(--bg) 55%);
       color:var(--txt);font:16px/1.7 -apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
       display:grid;place-items:center;height:100vh}
  body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;
    background:radial-gradient(44% 44% at 24% 26%,rgba(56,189,248,.34),transparent 60%),
     radial-gradient(40% 40% at 80% 20%,rgba(34,211,238,.24),transparent 62%),
     radial-gradient(46% 46% at 60% 86%,rgba(99,102,241,.20),transparent 62%);
    filter:blur(55px);animation:drift 32s ease-in-out infinite alternate}
  @keyframes drift{0%{transform:translate(-3%,-2%) scale(1)}100%{transform:translate(3%,4%) scale(1.1)}}
  .card{background:rgba(18,24,38,.8);border:1px solid var(--line);border-radius:18px;padding:34px 30px;width:340px;backdrop-filter:blur(10px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .logo img{width:40px;height:40px;border-radius:11px;object-fit:cover}
  .logo h1{margin:0;font-size:26px;font-weight:780;letter-spacing:.3px}
  .sub{color:var(--mut);font-size:12.5px;margin:0 0 22px}
  label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
  input{width:100%;background:#0e1420;border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:11px 13px;font:inherit;outline:none}
  input:focus{border-color:var(--accent)}
  button{width:100%;margin-top:20px;background:linear-gradient(135deg,var(--accent),#6366f1);color:#06121f;border:0;border-radius:11px;padding:12px;font-weight:700;font-size:15px;cursor:pointer}
  button:disabled{opacity:.5}
  .err{color:#fca5a5;font-size:12.5px;margin-top:12px;min-height:16px}
  .note{color:var(--mut);font-size:11px;margin-top:14px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><img src="/icon" alt="C"><h1>Casper</h1></div>
  <p class="sub">社内アカウント（Calendar と同じ）でログイン</p>
  <label>メール / ユーザー名</label>
  <!-- 例示に実在の個人名を使わぬ(殿御指摘2026-07-31: 携帯で開くと殿の名が入っておるように見える)。
       placeholder ゆえ送信はされぬが、社員には「既に誰かが入っておる」と映り紛らわしい。 -->
  <input id="email" autocomplete="username" placeholder="自分のユーザー名（例: yamada）">
  <label>パスワード</label>
  <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
  <button id="go">ログイン</button>
  <div class="err" id="err"></div>
  <div class="note">入力負担ゼロ 伴走AI</div>
</div>
<script>
const email=document.getElementById('email'), pw=document.getElementById('pw'),
      go=document.getElementById('go'), err=document.getElementById('err');
async function login(){
  err.textContent=''; go.disabled=true; go.textContent='確認中…';
  try{
    const r=await fetch('/api/login',{method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:email.value.trim(),password:pw.value})});
    const d=await r.json();
    if(d.ok){ location.href='/'; }
    else { err.textContent=d.error||'ログインできませんでした'; go.disabled=false; go.textContent='ログイン'; }
  }catch(e){ err.textContent='通信エラー: '+e.message; go.disabled=false; go.textContent='ログイン'; }
}
go.onclick=login;
[email,pw].forEach(el=>el.addEventListener('keydown',e=>{ if(e.key==='Enter') login(); }));
email.focus();
</script>
</body>
</html>
