<script>
  var wrap=document.getElementById('wrap'), svg=document.getElementById('mmsvg');
  var B={x:5.0,y:5.0,w:2367.68408203125,h:1081.78662109375}, vb={...B};
  function setVB(){ svg.setAttribute('viewBox', vb.x+' '+vb.y+' '+vb.w+' '+vb.h); }
  function fit(){ var r=wrap.getBoundingClientRect(), ar=r.width/r.height, w,h;
    if(B.w/B.h>ar){ w=B.w; h=w/ar; } else { h=B.h; w=h*ar; }
    vb={x:B.x-(w-B.w)/2, y:B.y-(h-B.h)/2, w:w, h:h}; setVB(); }
  function zoomAt(px,py,f){ var r=wrap.getBoundingClientRect();
    var sx=vb.x+(px/r.width)*vb.w, sy=vb.y+(py/r.height)*vb.h;
    var nw=Math.min(B.w*8, Math.max(B.w*0.04, vb.w*f)), nh=nw*(r.height/r.width);
    vb.x=sx-(px/r.width)*nw; vb.y=sy-(py/r.height)*nh; vb.w=nw; vb.h=nh; setVB(); }
  wrap.addEventListener('wheel',function(e){ e.preventDefault(); var r=wrap.getBoundingClientRect();
    zoomAt(e.clientX-r.left,e.clientY-r.top, e.deltaY<0?1/1.12:1.12); },{passive:false});
  var drag=false,lx,ly;
  wrap.addEventListener('mousedown',function(e){ drag=true; lx=e.clientX; ly=e.clientY; wrap.style.cursor='grabbing'; });
  window.addEventListener('mousemove',function(e){ if(!drag)return; var r=wrap.getBoundingClientRect();
    vb.x-=(e.clientX-lx)/r.width*vb.w; vb.y-=(e.clientY-ly)/r.height*vb.h; lx=e.clientX; ly=e.clientY; setVB(); });
  window.addEventListener('mouseup',function(){ drag=false; wrap.style.cursor='grab'; });
  document.getElementById('zin').onclick=function(){ var r=wrap.getBoundingClientRect(); zoomAt(r.width/2,r.height/2,1/1.25); };
  document.getElementById('zout').onclick=function(){ var r=wrap.getBoundingClientRect(); zoomAt(r.width/2,r.height/2,1.25); };
  document.getElementById('zrst').onclick=fit;
  window.addEventListener('resize',fit); fit();
</script></body></html>
