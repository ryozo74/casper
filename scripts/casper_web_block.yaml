# cmd_501: 取引先名の Web 検索遮断リスト(論点c)。
#
# pack.yaml の vocab 9語は3性質に分かれる(軍師分析):
#   甲(自社名): studio bokan/studiobokan/スタジオボカン
#   乙(取引先・案件名): marukome/マルコメ/NINA/Samurai Jack
#   丙(公開イベント名): CEATEC/InterBee
#
# 軍師三案:
#   案1(推奨): 乙のみ弾く
#   案2(安全側): 甲乙を弾く
#   案3(最小・現裁定): 弾かぬ
#
# 殿の裁可が出るまでは案3(現裁定)で動かす。このファイルは空/コメントアウト状態で出荷する。
# 裁可後、下の block: リストへ対象語を追加するだけで案1/案2へ移行できる(pack.yaml 自体は
# 書き換えない・案が固まった後に pack.yaml へ正式に移す前提の暫定置き場)。
#
# 例(案1採用時のイメージ・現在はコメントアウト):
#   block:
#     - marukome
#     - マルコメ
#     - NINA
#     - Samurai Jack

block: []
