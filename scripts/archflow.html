<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Casper アーキテクチャ — React Flow</title>
<link rel="stylesheet" href="https://unpkg.com/reactflow@11.11.4/dist/style.css">
<style>
  html,body,#root{margin:0;height:100%;background:#0b1220;font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif}
  .top{position:fixed;top:0;left:0;right:0;z-index:10;padding:9px 16px;background:rgba(11,18,32,.94);border-bottom:1px solid #22304a}
  .top h1{font-size:15px;margin:0;color:#e6edf6} .top .sub{font-size:12px;color:#64748b;margin-top:2px}
  .top .sub b{color:#dc2626}
  .react-flow__attribution{display:none}
  .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#93a4bd;font-size:14px}
  .err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#dc2626;font-size:13px;padding:30px;text-align:center}
</style></head>
<body>
<div class="top"><h1>Casper 現状アーキテクチャ — React Flow（触れる・ズーム・ドラッグ）</h1>
<div class="sub">根幹＝<b style="color:#9333ea">🧠 デュアルブレイン</b>：<b style="color:#7e22ce">左脳=構造化データ(事実)</b>＋<b style="color:#15803d">右脳=知識/記憶(文脈)</b>。伴走機構が両脳から接地(retrieve-then-render)して応答 ｜ <b style="color:#16a34a">✅ 自己改善ループ6項目=全実装済(緑・2026-07-09配線完了)</b></div></div>
<div id="root"><div class="loading">読み込み中…（React Flow を unpkg から取得）</div></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/reactflow@11.11.4/dist/umd/index.js" crossorigin></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js" crossorigin></script>
<script>
(function(){
  try{
    var React=window.React, createRoot=window.ReactDOM.createRoot, RF=window.ReactFlow, dagre=window.dagre;
    var ReactFlowC = RF.ReactFlow || RF.default;
    var Background=RF.Background, Controls=RF.Controls, MiniMap=RF.MiniMap;
    var h=React.createElement;

    // Casperの根幹=デュアルブレイン(左脳=事実 / 右脳=知識)。伴走機構が両脳から接地して応答。
    var T={n:"Casper\n入力負担ゼロ 伴走AI",root:true,c:[
      {n:"🧠 左脳\n構造化データ＝事実",brain:true,c:[
        {n:"Calendar\n真実源(Nibu)"},{n:"Score\nBFF(Elvis)"},
        {n:"casper_mcp\nMCPブリッジ"},{n:"casper_tools\nREST読取"},
        {n:"tasks 新19値\nAPI単一ソース"},{n:"projects\nisOverdue派生"},{n:"meetings\n議事録(ローカル生成)"},{n:"users\nroster永続"}
      ]},
      {n:"📚 右脳\n知識・記憶・文脈",brain:true,c:[
        {n:"vault\nObsidian"},{n:"people 人物"},{n:"activity 動向層"},{n:"culture_rules 掟"},
        {n:"postmortems 反省"},{n:"asset_shadows\n資産影"},
        {n:"RAG\nトライグラム"},{n:"embed bge-m3\n意味検索"},{n:"traits 人の癖"},{n:"openloop\n未了の約束"}
      ]},
      {n:"🎯 接地機構\n両脳から事実を引く",c:[
        {n:"digests 15種\nretrieve-then-render"},{n:"projects_digest"},{n:"active_tasks_digest"},
        {n:"verify_digest\nlive裏取り"},{n:"existence_digest\n捏造禁止"},{n:"manifest\n資産台帳=真実源"}
      ]},
      {n:"📤 アクション機構\npropose→execute",c:[
        {n:"P2 action_router\nDM型付き"},{n:"salvage\n漏れツール救済"},{n:"P1\n完了詐称の打消"},
        {n:"一覧はverbatim"},{n:"outbox 状態機械"}
      ]},
      {n:"🔧 ツール\nqwen function-calling",c:[
        {n:"search_vault\n右脳RAG"},{n:"calendar_lookup\n左脳"},{n:"send_message\nDM代筆"},{n:"update_task"}
      ]},
      {n:"🎛️ モデル\nqwen=言語の処理器",c:[
        {n:"qwen3.6:27b\n@z8a"},{n:"num_ctx 12288\nkeep_alive常駐"},{n:"format json\n制約デコード"},{n:"クラウドClaude\n縮退時"}
      ]},
      {n:"🖥️ 入口 フロント\nchat.html",c:[
        {n:"チャットUI\n疑似ストリーミング"},{n:"開門ブリーフィング"},{n:"承認カード\n副作用ゲート"},
        {n:"フィードバック\n🙅→修正リスト"},{n:"資料パネル\n節編集/版"},
        {n:"+ メニュー\nScore/報告書/Dropbox"},{n:"整理術 seiri"},{n:"描画\nmd/表/mermaid/canvas"}
      ]},
      {n:"🔗 外部連携",c:[
        {n:"Aurora 図書館"},{n:"Dropbox\n複数1リンク"},{n:"Vimeo tus再開可"},{n:"Discord nibu ch"}
      ]},
      {n:"🔄 自己改善ループ\nFable5 北極星",c:[
        {n:"trace 稼働"},{n:"eval\ngolden/gen_pending"},{n:"learn_bank\nfew-shot bank",nw:true},
        {n:"fewshot_digest",nw:true},{n:"health 稼働\n15分cron"},{n:"circuit breaker",nw:true},
        {n:"設定のデータ化\ndigests.yaml",nw:true},{n:"origin field",nw:true},{n:"attention\n今日の3件",nw:true}
      ]},
      {n:"✨ 主要機能",c:[
        {n:"朝ブリーフィング\nDM代筆"},{n:"資料作り\n報告書ビルダー"},{n:"整理術\n逆インタビュー"},{n:"Score Uploader\n結晶化"}
      ]}
    ]};

    var CAT={'🧠':'#9333ea','📚':'#16a34a','🎯':'#0d9488','📤':'#ea580c','🔧':'#0891b2',
      '🎛️':'#475569','🖥️':'#2563eb','🔗':'#db2777','🔄':'#ca8a04','✨':'#7c3aed'};
    function catOf(name){ for(var e in CAT){ if(name.indexOf(e)>=0) return CAT[e]; } return '#64748b'; }
    function hexA(hex,a){ var n=parseInt(hex.slice(1),16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }

    var idc=0, nodes=[], edges=[], byId={};
    function walk(node,parent,depth,cc){
      var id='n'+(idc++); node._id=id;
      var lines=node.n.split('\n'); var w=Math.max(130, Math.max.apply(null,lines.map(function(l){return l.length;}))*13+30);
      var hh=26+lines.length*17; node._w=w; node._h=hh;
      var todo=!!node.todo, nw=!!node.nw, root=!!node.root, l1=depth===1, brain=!!node.brain;
      if(brain){ w+=26; hh+=14; node._w=w; node._h=hh; }   // 両脳は一回り大きく=対等に際立たせる
      var mycc = l1 ? catOf(node.n) : cc;
      var bg,bd,col,fw='600', fs='12px';
      if(root){ bg='#0f172a'; bd='#334155'; col='#fff'; fw='800'; fs='14px'; }
      else if(l1){ bg=mycc; bd='#ffffff88'; col='#fff'; fw='800'; }
      else { bg='#141d2e'; bd=hexA(mycc||'#64748b',.6); col='#dbe4f0'; }
      if(todo){ bg='#3a1620'; bd='#f0679a'; col='#ffd7e6'; fw='800'; }
      if(nw){ bg='#122a1c'; bd='#22c55e'; col='#a7f3c9'; fw='800'; }   // 実装済(NEW・緑)
      if(brain){ fs='14px'; bd='#ffffff'; }               // 両脳=白縁+大きめ文字で対等強調
      var label=node.n+(todo?'  🔴 未実装':(nw?'  ✅ 実装済':''));
      var sh = brain ? '0 0 0 5px '+hexA(mycc,.28)+', 0 6px 16px rgba(0,0,0,.28)'
             : (todo?'0 0 0 4px rgba(220,38,38,.15)':(l1?'0 2px 8px rgba(0,0,0,.15)':'0 1px 3px rgba(0,0,0,.08)'));
      var rf={ id:id, data:{label:label}, position:{x:0,y:0},
        style:{ background:bg, color:col, border:(brain?'3px':'2px')+' solid '+bd, borderRadius:'13px', fontSize:fs,
          fontWeight:fw, padding:brain?'10px 14px':'7px 11px', width:w, whiteSpace:'pre-line', textAlign:'center', boxShadow:sh },
        _w:w, _h:hh };
      nodes.push(rf); byId[id]=rf;
      if(parent!==null) edges.push({ id:'e'+parent+'-'+id, source:parent, target:id, type:'straight',
        animated:(todo||nw), style:{stroke: todo?'#dc2626':(nw?'#16a34a':hexA(mycc||'#94a3b8',.65)), strokeWidth: todo?2.5:1.4} });
      (node.c||[]).forEach(function(c){ walk(c,id,depth+1,mycc); });
    }
    walk(T,null,0,null);

    // ── サラウンド(放射状)レイアウト: 中心=root、カテゴリを円状、子は外側へ放射 ──
    function leaves(n){ if(!n.c||!n.c.length){ n._lv=1; return 1; } n._lv=n.c.reduce(function(s,c){return s+leaves(c);},0); return n._lv; }
    leaves(T);
    var RINGS=[0, 430, 780, 1090, 1360];
    function radial(n,a0,a1,depth){
      var ang=(a0+a1)/2, r=RINGS[Math.min(depth,RINGS.length-1)], rf=byId[n._id];
      rf.position={ x: r*Math.cos(ang)-n._w/2, y: r*Math.sin(ang)-n._h/2 };
      var deg=((ang*180/Math.PI)%360+360)%360, sp,tp;
      if(deg>=315||deg<45){ sp='right'; tp='left'; }
      else if(deg<135){ sp='bottom'; tp='top'; }
      else if(deg<225){ sp='left'; tp='right'; }
      else{ sp='top'; tp='bottom'; }
      rf.sourcePosition=sp; rf.targetPosition=tp;
      if(n.c && n.c.length){ var a=a0, tot=n._lv;
        n.c.forEach(function(c){ var span=(a1-a0)*((c._lv||1)/tot); radial(c, a, a+span, depth+1); a+=span; }); }
    }
    radial(T, -Math.PI/2, 1.5*Math.PI, 0);   // 上(-90°)から時計回りに全周

    function App(){
      return h(ReactFlowC,{ defaultNodes:nodes, defaultEdges:edges, fitView:true, minZoom:0.12, maxZoom:3,
        nodesDraggable:true, proOptions:{hideAttribution:true}, style:{background:'#0b1220'} },
        h(Background,{color:'#1c2942', gap:22, size:1}),
        h(Controls,{showInteractive:false}),
        h(MiniMap,{pannable:true, zoomable:true,
          nodeColor:function(n){ return (n.style&&n.style.border||'').indexOf('dc2626')>=0?'#dc2626':(n.style&&n.style.background)||'#94a3b8'; },
          style:{background:'#0e1626',border:'1px solid #22304a'} })
      );
    }
    document.getElementById('root').innerHTML='';
    createRoot(document.getElementById('root')).render(h(App));
  }catch(e){
    document.getElementById('root').innerHTML='<div class="err">React Flow 読込失敗: '+(e&&e.message||e)+'<br>（unpkg 到達性 or UMDグローバルを確認）</div>';
  }
})();
</script>
</body></html>
