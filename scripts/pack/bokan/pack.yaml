# --- パックが束ねる構成要素(宣言。既に外出し済みのものを含む) ---
# 名前解決・工程オントロジーは既にデータ駆動ゆえ、ここでは「所在の宣言」のみ。
components:
  facts:        casper_context.md        # 会社事実 digest(build_brain_digest 再生成)
  process:      [transitions.json, config/verbs.yaml, config/authority.yaml]
  name_resolve: [roster_cache.json, person_traits.json, person_gate/]
  knowledge:    vault/
  golden:       cases.jsonl              # bokan データ依存 E2E golden(パック同梱)

# --- エンジン(横展開で不変・パックに含めない)を検問対象とする ---
# 下記は「bokan 語彙が居てはならぬ」ファイル群。pack_lint がスキャンする。
engine_scan:
  include_glob: ["*.py"]
  # パック側/データ側/外部ツールは検問から除外(bokan 語があって当然)
  exclude:
    - pack_lint.py            # 検問自身(語彙リストを読むため語が現れる)
    - dump_users.py
    - benchmark.py
    - test_llm_db_understanding.py
    # cmd_491 AC3: gate_*.py は固有名を pack(examples.project_names等)から受け取る形に
    # 改めたため、この exclude から外しても検問は緑を保つ(seam の隙間を塞いだ)。
