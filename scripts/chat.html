<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casper — Chat</title>
<link rel="icon" type="image/jpeg" href="/icon">
<link rel="apple-touch-icon" href="/icon">
<style>
  :root{ --bg:#0b0f17; --panel:#121826; --panel2:#0e1420; --line:#1f2937;
         --txt:#e5e7eb; --mut:#94a3b8; --accent:#38bdf8; --me:#1e293b; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(1200px 600px at 70% -10%,#10233a 0%,var(--bg) 55%);
       color:var(--txt);font:17px/1.75 -apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
       display:flex;flex-direction:column;height:100vh}
  body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;
    background:
     radial-gradient(44% 44% at 24% 26%,rgba(56,189,248,.38),transparent 60%),
     radial-gradient(40% 40% at 80% 20%,rgba(34,211,238,.26),transparent 62%),
     radial-gradient(46% 46% at 60% 86%,rgba(99,102,241,.22),transparent 62%),
     radial-gradient(34% 34% at 86% 74%,rgba(56,189,248,.24),transparent 62%);
    filter:blur(55px);animation:drift 32s ease-in-out infinite alternate}
  @keyframes drift{0%{transform:translate(-3%,-2%) scale(1) rotate(0deg)}
    50%{transform:translate(4%,3%) scale(1.13) rotate(8deg)}
    100%{transform:translate(-2%,4%) scale(1.06) rotate(-6deg)}}
  header{padding:14px 20px;border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:12px;background:rgba(18,24,38,.7);backdrop-filter:blur(8px)}
  header .logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
       background:linear-gradient(135deg,var(--accent),#6366f1);font-size:17px;object-fit:cover}
  header h1{font-size:24px;margin:0;font-weight:760;letter-spacing:.3px}
  header .sub{font-size:12px;color:var(--mut)}
  header .nav{display:flex;gap:8px;margin-left:18px}
  header .nav a{font-size:12.5px;color:var(--mut);text-decoration:none;border:1px solid var(--line);
       border-radius:999px;padding:5px 13px;transition:.12s}
  header .nav a:hover{border-color:var(--accent);color:var(--txt)}
  header .dot{margin-left:auto;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
  header .dot b{width:8px;height:8px;border-radius:50%;background:#475569;display:inline-block}
  header .dot.ok b{background:#22c55e;box-shadow:0 0 8px #22c55e}
  #log{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
  .wrap{max-width:1600px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  .msg{display:flex;gap:12px;align-items:flex-start}
  .msg.user{flex-direction:row-reverse}                 /* ユーザーは右側 */
  .msg.user{margin-left:auto}                             /* 行全体を右へ寄せる */
  .msg .av{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:15px;overflow:hidden}
  .msg.user .av{background:var(--me);color:var(--accent)}
  .msg.user .av img{width:100%;height:100%;object-fit:cover}
  .msg.bot  .av{background:linear-gradient(135deg,var(--accent),#6366f1);color:#06121f}
  /* 吹き出しは内容に合わせて幅可変(短文で横に間延びしない)。長文/表は上限まで広がる */
  .bubble{padding:11px 15px;border-radius:12px;white-space:pre-wrap;word-break:break-word;width:fit-content;max-width:min(88%,860px)}
  .msg.user .bubble{background:var(--me);border:1px solid var(--line);text-align:left;max-width:min(78%,720px);margin-left:auto}
  .msg.bot  .bubble{background:var(--panel);border:1px solid var(--line);min-width:0}
  .ptime{color:var(--mut);font-size:11px;margin-top:6px;opacity:.7}
  #menubtn{background:rgba(255,255,255,.06);border:1px solid #243049;color:#cfe8ff;border-radius:9px;width:38px;height:38px;font-size:17px;cursor:pointer;padding:0}
  #who{cursor:pointer}
  #sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;background:#0e1420;border-right:1px solid var(--line);z-index:30;transform:translateX(-100%);transition:.2s;display:flex;flex-direction:column;padding:14px}
  #sidebar.open{transform:translateX(0)}
  #sbmask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:29;display:none}
  /* 報告書ビルダー(右スライドイン) */
  #reppanel{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:#0c1018;border-left:1px solid var(--line);z-index:40;transform:translateX(100%);transition:.22s;display:flex;flex-direction:column}
  #reppanel.open{transform:translateX(0)}
  #repmask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:39;display:none}
  #rephead{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700}
  #rephead .x{margin-left:auto;cursor:pointer;font-size:18px;opacity:.7;background:none;border:none;color:inherit}
  #repbody{flex:1;overflow:auto;padding:16px 18px;font-size:14px}
  #repbody h3{margin:16px 0 8px;font-size:14px;color:#7dd3fc}
  #repbody label{display:block;margin:12px 0 4px;font-size:12px;color:var(--mut)}
  #repbody input,#repbody textarea{width:100%;box-sizing:border-box;background:#11182a;border:1px solid #243049;border-radius:8px;color:#e5e7eb;padding:8px 10px;font:inherit;font-size:13px}
  .repcard{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;background:#11182a;border:1px solid #243049;border-radius:10px;color:#e5e7eb;cursor:pointer;font:inherit}
  .repcard.sel{border-color:#38bdf8;background:#15233a}
  .repcard small{color:var(--mut)}
  .reppage{background:#0f1828;border:1px solid #1f2c40;border-radius:10px;padding:8px 12px;margin:6px 0}
  .reppage ul{margin:4px 0 0;padding-left:18px}.reppage small{color:var(--mut)}
  .repadvice{background:linear-gradient(135deg,rgba(56,189,248,.12),rgba(167,139,250,.10));border:1px solid rgba(56,189,248,.3);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13px}
  .repchoices{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
  .repopt{padding:6px 12px;background:#11182a;border:1px solid #243049;border-radius:999px;color:#e5e7eb;cursor:pointer;font:inherit;font-size:12px}
  .repopt.sel{border-color:#22c55e;background:#16321f}
  #repbody .repbtn{margin-top:16px;padding:9px 16px;background:#1e293b;border:1px solid #38bdf8;border-radius:9px;color:#e5e7eb;cursor:pointer;font:inherit}
  #repbody .repbtn:disabled{opacity:.4;cursor:default}
  .reploading{padding:24px;text-align:center;color:var(--mut)}
  .reperr{padding:12px;color:#fca5a5}
  #reppreview{border:1px solid #1f2c40;border-radius:10px;padding:6px 14px;margin:8px 0;background:#0a0e16}
  #reppreview .rblk{cursor:text;border-radius:6px;padding:1px 4px;transition:.1s}
  #reppreview .rblk:hover{background:rgba(56,189,248,.08)}
  #reppreview .repediting{background:rgba(56,189,248,.14);outline:1px solid #38bdf8}
  #reppreview.drag{outline:2px dashed #38bdf8}
  .rephd{display:flex;align-items:center;gap:8px;font-weight:700}.rephd a{color:#38bdf8;font-size:12px;text-decoration:none}
  .rephint{font-size:12px;color:var(--mut);margin:4px 0}
  #sbmask.open{display:block}
  .sbhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  #newthread{height:32px;font-size:13px;padding:0 12px}
  #threadlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
  .thr{display:flex;align-items:center;gap:6px;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--txt);border:1px solid transparent}
  .thr:hover{background:rgba(255,255,255,.05);border-color:#243049}
  .thr.cur{background:rgba(125,211,252,.14);border-color:#3a4a66}
  .thr .ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .thr .del{color:var(--mut);cursor:pointer;font-size:12px}
  .sbsec{font-size:11px;color:var(--mut);margin:10px 4px 4px;font-weight:700;letter-spacing:.05em}
  .ubadge{background:#ef4444;color:#fff;border-radius:999px;padding:0 6px;font-size:10px;margin-left:4px}
  .udot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ef4444;margin-right:5px;vertical-align:middle}
  .thr.dm .scorelink{color:var(--mut);text-decoration:none;font-size:13px;padding:0 4px}
  .thr.dm .scorelink:hover{color:var(--accent)}
  .think{color:var(--mut);font-size:12.5px;font-style:italic;border-left:2px solid var(--line);
         padding-left:10px;margin:2px 0 6px;white-space:pre-wrap}
  footer{border-top:1px solid var(--line);padding:14px 20px;background:rgba(14,20,32,.7);backdrop-filter:blur(8px)}
  .ic{max-width:1600px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  textarea{flex:1;resize:none;background:var(--panel2);color:var(--txt);border:1px solid var(--line);
           border-radius:12px;padding:11px 14px;font:inherit;max-height:160px;outline:none}
  textarea:focus{border-color:var(--accent)}
  button{background:linear-gradient(135deg,var(--accent),#6366f1);color:#06121f;border:0;
         border-radius:12px;padding:0 18px;height:44px;font-weight:650;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .hint{max-width:1600px;margin:6px auto 0;color:var(--mut);font-size:11.5px;text-align:center}
  .cursor::after{content:"▍";color:var(--accent);animation:bl 1s steps(2) infinite}
  .diagbtn{display:inline-block;margin-top:10px;background:linear-gradient(135deg,var(--accent),#6366f1);
    color:#06121f;text-decoration:none;border-radius:10px;padding:8px 15px;font-weight:700;font-size:14px}
  .diagbtn:hover{filter:brightness(1.1)}
  /* 表は Aurora を基準 (render_local.py の table トークンと統一) */
  .md table.mdtbl{border-collapse:collapse;margin:12px 0;font-size:13px;width:100%;
    background:rgba(14,20,32,.5);border:1px solid #1f2937;border-radius:10px;overflow:hidden}
  .md .mdtbl th{text-align:left;padding:9px 12px;border-bottom:2px solid #2b3a55;color:#bfe6ff;font-weight:700;white-space:nowrap}
  .md .mdtbl td{padding:8px 12px;border-bottom:1px solid #1c2436;color:#dbe4ee;vertical-align:top}
  .md img.thumb{max-width:108px;max-height:80px;border-radius:6px;cursor:zoom-in;display:inline-block;margin:2px;border:1px solid #243049}
  .md img.thumb.big{max-width:min(82vw,560px);max-height:none;cursor:zoom-out}
  .md h3,.md h4,.md h5{margin:13px 0 6px;line-height:1.3}
  .md p{margin:3px 0} .md ul{margin:2px 0 4px 20px} .md li{margin:1px 0}
  .md code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:4px;font-size:.92em}
  .md a{color:var(--accent)}
  .md pre.code{background:rgba(10,15,25,.7);border:1px solid #1f2937;border-radius:10px;padding:10px 13px;overflow:auto;font-size:12.5px;line-height:1.5}
  .md pre.mermaid{background:rgba(14,20,32,.5);border:1px solid #1f2937;border-radius:12px;padding:12px;margin:12px 0;text-align:center;overflow:auto}
  .md pre.mermaid svg{max-width:100%;height:auto}
  .md .canvas{margin:12px 0}
  .md iframe.canvasframe{width:100%;height:440px;border:1px solid #1f2937;border-radius:12px;background:#fff}
  .md .pdfwrap{margin:12px 0;border:1px solid #1f2937;border-radius:12px;overflow:hidden}
  .md .pdfbar{background:#16233b;padding:7px 12px;font-size:12.5px;color:#bfe6ff;display:flex;justify-content:space-between;align-items:center}
  .md .pdfbar a{color:var(--accent);text-decoration:none;font-size:12px}
  .md iframe.pdfframe{width:100%;height:520px;border:0;background:#fff;display:block}
  .md .vid{position:relative;width:100%;max-width:640px;aspect-ratio:16/9;margin:12px 0}
  .md .vid iframe,.md .vid video{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:12px;background:#000}
  .fb{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;opacity:.75}
  .fb:hover{opacity:1}
  .fbbtn{background:rgba(255,255,255,.05);border:1px solid #243049;color:var(--mut);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer}
  .fbbtn:hover{background:rgba(125,211,252,.14);color:#cfe8ff;border-color:#3a4a66}
  .fbthx{color:var(--mut);font-size:12px}
  #plus{background:rgba(255,255,255,.06);border:1px solid #243049;color:#cfe8ff;border-radius:10px;width:42px;font-size:20px;cursor:pointer}
  #plus:hover{background:rgba(125,211,252,.15)}
  .toolmenu{position:absolute;bottom:64px;left:14px;background:#11182a;border:1px solid #243049;border-radius:12px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:9}
  .tmitem{padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px}
  .tmitem:hover{background:rgba(125,211,252,.15)}
  #tools{display:inline-flex;align-items:center}
  .toolico{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:rgba(125,211,252,.16);border:1px solid #3a4a66;font-size:17px;cursor:pointer;flex:none}
  .toolico:hover{background:rgba(125,211,252,.28)}
  #attach .filechip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid #243049;border-radius:10px;padding:5px 10px;font-size:12px;margin:0 0 6px 4px}
  #attach .filechip img{width:40px;height:30px;object-fit:cover;border-radius:5px}
  .ulcard{background:rgba(14,20,32,.6);border:1px solid #1f2937;border-radius:12px;padding:12px;margin:8px 0}
  .ulopt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.04);border:1px solid #243049;color:#dbe4ee;border-radius:9px;padding:8px 11px;margin:4px 0;cursor:pointer;font-size:13px}
  .ulopt:hover{background:rgba(125,211,252,.13);border-color:#3a4a66}
  .ulopt.sel{background:rgba(125,211,252,.2);border-color:var(--accent)}
  .ulsubmit{background:linear-gradient(135deg,var(--accent),#6366f1);color:#06121f;border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;margin-top:8px}
  .dragover{outline:2px dashed var(--accent);outline-offset:-6px}
  @keyframes bl{50%{opacity:0}}
</style>
<script type="module">
  // Mermaid: 工程/流れ/関係/タイムライン図を text から描画 (Canvas/Artifacts 方式の第一歩)
  try{
    const m=await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
    m.default.initialize({startOnLoad:false, theme:'dark', securityLevel:'strict'});
    window.__mermaid=m.default;
  }catch(e){ console.warn('mermaid load failed', e); }
</script>
</head>
<body>
<header>
  <button id="menubtn" title="スレッド一覧">☰</button>
  <div><h1 onclick="location.reload()" style="cursor:pointer" title="クリックで再読込">Casper</h1></div>
  <nav class="nav"><a href="/learn">🧠 Casperに教える</a><a href="/play">🎲 Casperと遊ぶ</a><a href="/seiri">🧹 Casperで整理</a><a href="/peek">🔮 Casperをのぞく</a></nav>
  <span id="today" style="color:var(--mut);font-size:12px;margin-left:auto"></span>
  <div class="dot" id="who" title="ログイン"><span id="whoav">👤</span> <span id="whoname">ゲスト</span></div>
  <div class="dot" id="status"><b></b><span>接続確認中…</span></div>
</header>
<div id="sidebar">
  <div class="sbhd"><b>スレッド</b><button id="newthread">＋ 新規</button></div>
  <div id="threadlist"></div>
</div>
<div id="sbmask"></div>
<div id="repmask"></div>
<div id="reppanel">
  <div id="rephead">📝 報告書を作る<button class="x" id="repClose">✕</button></div>
  <div id="repbody"></div>
</div>
<div id="log"><div class="wrap" id="wrap"></div></div>
<footer>
  <div id="attach"></div>
  <div class="ic">
    <button id="plus" title="ツールを追加">＋</button>
    <span id="tools"></span>
    <textarea id="inp" rows="1" placeholder="メッセージを入力（Enterで送信・Shift+Enterで改行）"></textarea>
    <button id="send">送信</button>
  </div>
  <div id="toolmenu" class="toolmenu" style="display:none">
    <div class="tmitem" data-tool="score_uploader">🎬 Score Uploader（成果物を投げる）</div>
    <div class="tmitem" data-tool="report">📝 報告書を作る</div>
  </div>
  <input type="file" id="fileinp" accept="image/*,video/*" style="display:none">
  <div class="hint">応答に数秒〜十数秒かかることがあります。</div>
</footer>
<script>
const wrap=document.getElementById('wrap'), log=document.getElementById('log');
const inp=document.getElementById('inp'), send=document.getElementById('send');
// 先回りウォーム(Fable): 入力にfocusした瞬間qwenのロードを開始→打っている間に温まり、送信時には速い。2分に1回に絞る。
let _lastWarm=0;
inp.addEventListener('focus',()=>{ const t=Date.now(); if(t-_lastWarm>120000){ _lastWarm=t; fetch('/api/prewarm',{credentials:'same-origin'}).catch(()=>{}); } });
const status=document.getElementById('status');
const history=[];

fetch('/health').then(r=>r.json()).then(d=>{status.classList.add('ok');
  status.querySelector('span').textContent='接続OK ('+(d.model||'')+')';})
  .catch(()=>status.querySelector('span').textContent='鯖に接続できぬ');

let USER_AV='';                                  // ScoreのユーザーアバターURL(/api/whoami由来)
function el(role){
  const m=document.createElement('div'); m.className='msg '+role;
  const uav = USER_AV ? '<img src="'+USER_AV+'" alt="殿" onerror="this.remove()">' : '殿';
  m.innerHTML=`<div class="av">${role==='user'?uav:'<img src="/icon" alt="C" style="width:100%;height:100%;object-fit:cover;border-radius:8px">'}</div>`;
  const b=document.createElement('div'); b.className='bubble'; m.appendChild(b);
  wrap.appendChild(m); log.scrollTop=log.scrollHeight; return b;
}
function attachEdit(msgDiv, idx, text){
  // 誤発言の地点まで巻き戻して編集(ロールバック)。idx=この発言の履歴位置。
  const e=document.createElement('span'); e.textContent='✏️ 編集';
  e.title='ここまで巻き戻して編集し直す';
  e.style.cssText='cursor:pointer;font-size:11px;color:var(--mut);margin-left:8px;opacity:.5;user-select:none';
  e.onmouseover=()=>e.style.opacity='1'; e.onmouseout=()=>e.style.opacity='.5';
  e.onclick=()=>{
    history.length=idx;                              // この発言以降を切り捨て
    let node=msgDiv; while(node){ const nx=node.nextElementSibling; node.remove(); node=nx; }
    inp.value=text; inp.style.height='auto'; enableInput(); inp.focus();
  };
  msgDiv.appendChild(e);
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inlineMd(s){
  s=esc(s);
  s=s.replace(/!\[[^\]]*\]\((\/asset\/[A-Za-z0-9_.\-]+)\)/g,'<img class="thumb" src="$1" loading="lazy" onerror="this.replaceWith(document.createTextNode(\'⚠画像なし:\'+this.src.split(\'/\').pop()))" onclick="this.classList.toggle(\'big\')">');
  s=s.replace(/\[([^\]]+)\]\(casper-dm:(\d+):(\d*)\)/g,'<a href="#" class="dmlink" data-dm="$2" data-pid="$3" onclick="openDMById(this);return false">$1</a>');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  return s;
}
function mediaEmbed(ln){
  // Vimeo / YouTube / 直リンク動画 を埋め込みプレイヤーに
  let m=ln.match(/(?:player\.vimeo\.com\/video\/|vimeo\.com\/)(\d+)/);
  if(m){
    const id=m[1];
    const hm=ln.match(/[?&]h=([A-Za-z0-9]+)/)||ln.match(new RegExp(id+'\\/([A-Za-z0-9]+)'));  // 限定動画のhash
    const hq=hm?('?h='+hm[1]):'';
    return '<div class="vid"><iframe src="https://player.vimeo.com/video/'+id+hq+'" allow="fullscreen;picture-in-picture" allowfullscreen></iframe></div>';
  }
  m=ln.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  if(m) return '<div class="vid"><iframe src="https://www.youtube.com/embed/'+m[1]+'" allowfullscreen></iframe></div>';
  m=ln.match(/(https?:\/\/[^\s)]+\.(?:mp4|webm|mov))/i);
  if(m) return '<div class="vid"><video controls src="'+m[1]+'"></video></div>';
  // PDF リンク(/asset/...pdf 等) → インラインPDFビューア＋開くリンク
  m=ln.match(/\]\(([^)]+\.pdf)\)/i) || ln.match(/(\/asset\/[^\s)]+\.pdf|https?:\/\/[^\s)]+\.pdf)/i);
  if(m){ const u=m[1]; const nm=(ln.match(/\[([^\]]+)\]\([^)]+\.pdf\)/i)||[])[1]||decodeURIComponent(u.split('/').pop());
    return '<div class="pdfwrap"><div class="pdfbar">📄 '+esc(nm)+' <a href="'+esc(u)+'" target="_blank">↗ 別タブで開く</a></div>'
      +'<iframe class="pdfframe" src="'+esc(u)+'#view=FitH" loading="lazy"></iframe></div>'; }
  // Office(pptx/docx/xlsx) リンク → ダウンロードチップ(＋変換PDFがあれば別途 .pdf リンクで表示)
  m=ln.match(/(\/asset\/[^\s)]+\.(?:pptx|docx|xlsx))/i);
  if(m){ const u=m[1]; const nm=decodeURIComponent(u.split('/').pop());
    const ic=/\.pptx$/i.test(u)?'📊':/\.xlsx$/i.test(u)?'📗':'📄';
    return '<div class="pdfbar" style="border:1px solid #1f2937;border-radius:10px;margin:10px 0">'+ic+' '+esc(nm)+' <a href="'+esc(u)+'" download>⬇ ダウンロード</a></div>'; }
  return null;
}
function mdToHtml(src){
  const L=src.split('\n'); const out=[]; let i=0;
  const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  while(i<L.length){
    const ln=L[i];
    // 動画(Vimeo/YouTube/mp4)URL を含む行 → プレイヤー埋め込み
    const mv=mediaEmbed(ln);
    if(mv){ out.push(mv); i++; continue; }
    // 裸のHTML/SVG文書(フェンス無し)も Canvas として隔離描画
    if(/^\s*<!doctype html/i.test(ln) || /^\s*<html[\s>]/i.test(ln) || /^\s*<svg[\s>]/i.test(ln)){
      const isSvg=/^\s*<svg[\s>]/i.test(ln); const closeRe=isSvg?/<\/svg>/i:/<\/html>/i;
      let end=L.length; for(let k=i;k<L.length;k++){ if(closeRe.test(L[k])){ end=k+1; break; } }
      const code=L.slice(i,end).join('\n');
      out.push('<div class="canvas" data-html="'+btoa(unescape(encodeURIComponent(code)))+'"></div>');
      i=end; continue;
    }
    // コードフェンス: ```mermaid → 図、その他 ``` → コード
    const f=ln.match(/^\s*```\s*([A-Za-z0-9]*)\s*$/);
    if(f){
      let j=i+1; const body=[];
      while(j<L.length && !/^\s*```\s*$/.test(L[j])){body.push(L[j]);j++;}
      const code=body.join('\n'); const lang=f[1].toLowerCase();
      if(lang==='mermaid'){ out.push('<pre class="mermaid">'+esc(code)+'</pre>'); }
      else if(lang==='html'||lang==='svg'){ // Canvas: 自己完結HTML/SVGをサンドボックスiframeで描画
        out.push('<div class="canvas" data-html="'+btoa(unescape(encodeURIComponent(code)))+'"></div>'); }
      else if(lang==='markdown'||lang==='md'){ out.push(mdToHtml(code)); } // ```markdown 囲みは中身を描画(表/画像が文字化けするのを防ぐ)
      else { out.push('<pre class="code"><code>'+esc(code)+'</code></pre>'); }
      i=(j<L.length)?j+1:j; continue;
    }
    if(/^\s*\|.*\|\s*$/.test(ln) && i+1<L.length && /^\s*\|[\s:|-]+\|\s*$/.test(L[i+1])){
      let j=i; const blk=[];
      while(j<L.length && /^\s*\|.*\|\s*$/.test(L[j])){blk.push(L[j]);j++;}
      const head=cells(blk[0]), rows=blk.slice(2).map(cells);
      let t='<table class="mdtbl"><thead><tr>'+head.map(c=>'<th>'+inlineMd(c)+'</th>').join('')+'</tr></thead><tbody>';
      t+=rows.map(r=>'<tr>'+r.map(c=>'<td>'+inlineMd(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
      out.push(t); i=j; continue;
    }
    const h=ln.match(/^(#{1,4})\s+(.*)$/);
    if(h){const n=Math.min(h[1].length+2,5); out.push('<h'+n+'>'+inlineMd(h[2])+'</h'+n+'>'); i++; continue;}
    if(/^\s*[-*]\s+/.test(ln)){
      const it=[]; while(i<L.length && /^\s*[-*]\s+/.test(L[i])){it.push('<li>'+inlineMd(L[i].replace(/^\s*[-*]\s+/,''))+'</li>'); i++;}
      out.push('<ul>'+it.join('')+'</ul>'); continue;
    }
    if(ln.trim()===''){i++; continue;}
    out.push('<p>'+inlineMd(ln)+'</p>'); i++;
  }
  return out.join('\n');
}
function render(b, raw){
  // <think>…</think> を淡色の別ブロックに、本文は markdown 描画 (表/サムネ/箇条書き)
  let think='', body=raw;
  const m=raw.match(/<think>([\s\S]*?)(<\/think>|$)/);
  if(m){ think=m[1].trim(); body=raw.replace(/<think>[\s\S]*?(<\/think>|$)/,'').trim(); }
  b.innerHTML='';
  if(think){ const t=document.createElement('div'); t.className='think'; t.textContent='💭 '+think; b.appendChild(t); }
  const p=document.createElement('div'); p.className='md'; p.innerHTML=mdToHtml(body); b.appendChild(p);
}

function renderCanvas(b){
  // 自己完結HTML/SVGを隔離iframe(allow-scripts・same-origin無し=親に触れない)で描画
  b.querySelectorAll('.canvas:not([data-done])').forEach(el=>{
    el.setAttribute('data-done','1');
    let html=''; try{ html=decodeURIComponent(escape(atob(el.getAttribute('data-html')||''))); }catch(e){ return; }
    const f=document.createElement('iframe');
    f.className='canvasframe'; f.setAttribute('sandbox','allow-scripts');
    f.setAttribute('loading','lazy'); f.srcdoc=html;
    el.appendChild(f);
  });
}
async function renderMermaid(b){
  const nodes=b.querySelectorAll('pre.mermaid:not([data-done])');
  if(!nodes.length) return;
  // ローダ完了待ち (最大3秒)
  for(let t=0;!window.__mermaid&&t<30;t++){ await new Promise(r=>setTimeout(r,100)); }
  if(!window.__mermaid) return;
  let n=0;
  for(const el of nodes){
    el.setAttribute('data-done','1');
    try{
      const code=el.textContent.trim().replace(/\\n/g,'<br/>');  // ラベル内 \n → 改行
      const {svg}=await window.__mermaid.render('mmd_'+Date.now()+'_'+(n++), code);
      el.innerHTML=svg;
    }catch(e){ /* 記法エラー時は元のテキストを残す */ }
  }
}
async function ask(){
  const text=inp.value.trim(); if(!text) return;
  inp.value=''; inp.style.height='auto'; send.disabled=true;
  let umsg=text;                                  // DMモード時は指示を付与(表示は元テキスト)
  if(curDM&&curDM.mode==='reply'){ umsg='【'+(curDM.peer||'相手')+'（uid '+(curDM.peer_id||'?')+'）へのDM返信】次の本文を send_message で本人名義送信して: '+text; }
  else if(curDM&&curDM.mode==='question'){ umsg='【DM「'+(curDM.peer||'')+'」について】'+text; }
  const _ub=el('user'); _ub.textContent=text; attachEdit(_ub.parentElement, history.length, text); history.push({role:'user',content:umsg});
  const b=el('bot'); b.classList.add('cursor'); b.textContent='';
  let acc='',diagramUrl=null,pendingConfirms=[]; const t0=performance.now();
  try{
    const r=await fetch('/api/chat',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:history, thread:curThread})});
    const reader=r.body.getReader(), dec=new TextDecoder(); let buf='';
    while(true){
      const {value,done}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let nl; while((nl=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,nl).trim(); buf=buf.slice(nl+1);
        if(!line) continue;
        let j; try{ j=JSON.parse(line);}catch(e){ continue; }
        if(j.error){ acc+='\n[error] '+j.error; }
        else if(j.status){ if(!acc){ b.textContent=j.status; log.scrollTop=log.scrollHeight; } continue; }  // 縮退: 本回答前の"少々お待ちを"(accには足さず、本文が来たら上書きされる)
        else if(j.message&&j.message.content){ acc+=j.message.content; }
        else if(j.diagram){ diagramUrl=j.diagram; }
        else if(j.confirm){ pendingConfirms.push(j.confirm); }
        render(b,acc); log.scrollTop=log.scrollHeight;
      }
    }
  }catch(e){ acc+='\n[通信失敗] '+e.message; render(b,acc); }
  b.classList.remove('cursor');
  const dt=((performance.now()-t0)/1000).toFixed(1);
  const tm=document.createElement('div'); tm.className='ptime'; tm.textContent='⏱ '+dt+'s'; b.appendChild(tm);
  renderMermaid(b); renderCanvas(b); addFeedback(b, text, acc); log.scrollTop=log.scrollHeight;
  if(diagramUrl){const da=document.createElement('a');da.href=diagramUrl;da.target='_blank';
    da.className='diagbtn';da.textContent='📊 図解を表示';b.appendChild(da);}
  pendingConfirms.forEach(pa=>renderConfirm(b,pa));   // Stage2: 承認待ち操作のカード
  history.push({role:'assistant',content:acc});
  send.disabled=false; inp.focus();
  saveThread();
}

function renderConfirm(b, pa){
  const c=document.createElement('div');
  c.style.cssText='margin:10px 0;padding:12px 14px;border:1px solid #f59e0b;border-radius:12px;background:rgba(245,158,11,.08)';
  const isDM=(pa.tool==='send_message');
  const h=document.createElement('div'); h.textContent=isDM?'📨 DM送信の承認 — 宛先を必ず確認':'🔐 承認が必要な操作'; h.style.cssText='font-weight:700;margin-bottom:6px;color:#f59e0b';
  let rc=null;
  if(isDM){
    const mto=(pa.summary||'').match(/宛先[:：]\s*([^（(]+)/);
    rc=document.createElement('div');
    rc.innerHTML='📨 宛先: <b style="font-size:18px;color:#fca5a5">'+esc(mto?mto[1].trim():'(不明)')+'</b> さん ← この方で間違いないですか？';
    rc.style.cssText='font-size:14px;margin-bottom:8px;padding:8px 10px;border:1px solid #ef4444;border-radius:8px;background:rgba(239,68,68,.12)';
  }
  const editable = pa.args && typeof pa.args.body==='string';   // 本文を持つ副作用(DM/Aurora)は編集可
  const s=document.createElement('div');
  s.textContent = editable ? (pa.summary||pa.tool).split('──')[0].trim() : (pa.summary||pa.tool);
  s.style.cssText='font-size:14px;margin-bottom:8px;white-space:pre-wrap';
  let ta=null, talb=null;
  if(editable){
    talb=document.createElement('div'); talb.textContent='本文（送信前に編集できます）:'; talb.style.cssText='font-size:12px;color:#94a3b8;margin-bottom:4px';
    ta=document.createElement('textarea'); ta.value=pa.args.body||'';
    ta.style.cssText='width:100%;box-sizing:border-box;min-height:84px;margin-bottom:10px;padding:8px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e5e7eb;font:inherit;white-space:pre-wrap';
  }
  const bs=document.createElement('div'); bs.style.cssText='display:flex;gap:8px';
  const ok=document.createElement('button'); ok.textContent='✅ 承認して実行';
  const ng=document.createElement('button'); ng.textContent='却下';
  [ok,ng].forEach(x=>x.style.cssText='padding:7px 14px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e5e7eb;cursor:pointer;font:inherit');
  ok.style.borderColor='#22c55e';
  const rEl=document.createElement('div'); rEl.style.cssText='margin-top:8px;font-size:13px;color:#94a3b8';
  // DM送信は誤送信防止のため二段確認(1回目=確認を促すだけ・2回目で実送信)。流れで押しても飛ばない。
  let _armed=false;
  const doExec=async()=>{ ok.disabled=ng.disabled=true; rEl.textContent='実行中…';
    const res=await jpost('/api/confirm',{id:pa.id,approve:true, body: ta?ta.value:undefined});
    if(res.ok&&res.executed){
      if(pa.tool==='send_message'){
        rEl.textContent='✅ 送信しました';
        let tid=null; try{ tid=JSON.parse(res.result||'{}').thread_id; }catch(e){}
        if(!tid){ const mm=String(res.result||'').match(/"thread_id"\s*:\s*(\d+)/); if(mm) tid=mm[1]; }
        if(tid){ const mt=(pa.summary||'').match(/宛先[:：]\s*([^（(]+)（uid\s*(\d+)/);   // 自動で画面遷移せず、任意リンクに(混乱回避)
          const lk=document.createElement('a'); lk.href='#'; lk.textContent='📨 この会話を開く';
          lk.style.cssText='color:#38bdf8;margin-left:10px;text-decoration:underline';
          lk.onclick=(e)=>{e.preventDefault();openDM({id:tid,peer:(mt?mt[1].trim():'DM'),peer_id:(mt?mt[2]:null)});};
          rEl.appendChild(lk);
        }
      } else { rEl.textContent='✅ 実行しました: '+(res.result||''); }
    } else { rEl.textContent='⚠️ '+(res.error||res.message||'失敗'); }
  };
  ok.onclick=()=>doExec();
  ng.onclick=async()=>{ ok.disabled=ng.disabled=true; await jpost('/api/confirm',{id:pa.id,approve:false}); rEl.textContent='却下しました'; };
  bs.appendChild(ok); bs.appendChild(ng);
  c.appendChild(h); if(rc) c.appendChild(rc); c.appendChild(s);
  if(ta){ c.appendChild(talb); c.appendChild(ta); }
  c.appendChild(bs); c.appendChild(rEl);
  b.appendChild(c);
}

function vimeoUpload(){
  if(!pendingFile) return;
  const f=pendingFile; clearFile();
  const base=(f.name||'').replace(/\.[^.]+$/,'');
  const b=el('bot');
  const inS='width:100%;box-sizing:border-box;margin:2px 0 10px;padding:8px 10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e5e7eb;font:inherit';

  b.innerHTML='<div style="border:1px solid #334155;border-radius:12px;padding:14px;background:rgba(255,255,255,.03)">'
    +'<div style="font-weight:700;margin-bottom:10px">🎬 Vimeo アップ設定 — '+esc(f.name)+'</div>'
    +'<label style="'+lbS+'">タイトル</label><input id="vmTitle" style="'+inS+'" value="'+esc(base)+'">'
    +'<label style="'+lbS+'">説明 <span style="color:#22c55e">（後でCasperが検索できるよう推奨）</span></label><textarea id="vmDesc" rows="2" placeholder="この動画は何か・どのPJ/案件か・要点。例: marukome 80tタンクCG c05 味噌熟成カット v3" style="'+inS+'"></textarea>'
    +'<label style="'+lbS+'">パスワード（任意・空欄なら無し）</label><input id="vmPw" style="'+inS+'" placeholder="例: bokan2026">'
    +'<div style="display:flex;gap:8px"><button id="vmGo" style="'+btS+';border-color:#22c55e">アップロード</button>'
    +'<button id="vmCancel" style="'+btS+'">キャンセル</button></div></div>';
  document.getElementById('vmGo').onclick=()=>{
    const desc=document.getElementById('vmDesc').value.trim();
    // 説明が薄いと別会話から探せない→アップ前に一度だけ確認(必要なら書き足してもらう)
    if(desc.length<8 && !document.getElementById('vmDesc').dataset.confirmed){
      const dd=document.getElementById('vmDesc');
      dd.dataset.confirmed='1';
      dd.style.borderColor='#22c55e';
      const warn=document.createElement('div');
      warn.style.cssText='font-size:12px;color:#fbbf24;margin:-6px 0 8px';
      warn.textContent='💡 説明があると、後でCasperが「あの動画」と探せます。書き足すか、このままアップなら再度ボタンを押してください。';
      dd.parentNode.insertBefore(warn, dd.nextSibling);
      return;
    }
    doVimeoUpload(f, document.getElementById('vmTitle').value,
      document.getElementById('vmDesc').value, document.getElementById('vmPw').value, b);
  };
  document.getElementById('vmCancel').onclick=()=>{ b.textContent='（アップロードを中止しました）'; };
  log.scrollTop=log.scrollHeight;
}
async function doVimeoUpload(f,title,desc,pw,b){
  if(!f.file){ render(b,'⚠️ ファイルが取得できません。添付し直して下さい'); return; }
  b.classList.add('cursor'); b.textContent='準備中…';
  // ① サーバで Vimeo 動画作成 + tus upload_link 取得(本体データは送らない)
  let cr; try{ cr=await apiPost('/api/vimeo/create',{size:f.file.size,title:title||f.name,description:desc||'',password:pw||''}); }catch(e){ cr={ok:false,error:e.message}; }
  if(!cr||!cr.ok){ b.classList.remove('cursor'); render(b,'⚠️ 作成失敗: '+((cr&&cr.error)||'不明')); return; }
  // ② ブラウザから Vimeo へ直接 tus 送信(64MB分割・大容量対応)
  const file=f.file, size=file.size, CHUNK=64*1024*1024; let offset=0;
  try{
    while(offset<size){
      const slice=file.slice(offset, Math.min(offset+CHUNK,size));
      const resp=await fetch(cr.upload_link,{method:'PATCH',headers:{'Tus-Resumable':'1.0.0','Upload-Offset':String(offset),'Content-Type':'application/offset+octet-stream'},body:slice});
      if(!resp.ok && resp.status!==204) throw new Error('tus HTTP '+resp.status);
      const no=resp.headers.get('Upload-Offset');
      offset = (no!=null) ? parseInt(no) : (offset+slice.size);
      b.textContent='アップロード中… '+Math.round(offset/size*100)+'%';
    }
  }catch(e){ b.classList.remove('cursor'); render(b,'⚠️ 送信失敗: '+e.message+'（ネット/CORS の可能性）'); return; }
  b.classList.remove('cursor');
  const md='✅ **Vimeo へアップしました**\n\n確認リンク: '+cr.link+(pw?('\nパスワード: `'+pw+'`'):'')+'\n\n'+cr.link;
  render(b,md); renderMermaid(b);
  log.scrollTop=log.scrollHeight;
}
function takeFile(f){
  if(!f) return;
  if(f.type.startsWith('image/')){               // 画像=vision用にbase64化(小容量)
    const r=new FileReader();
    r.onload=()=>{ const du=r.result; pendingFile={name:f.name, b64:du.split(',')[1], dataurl:du, isImage:true, file:f}; if(!uploaderOn){uploaderOn=true;renderTools();} renderFile(); };
    r.readAsDataURL(f);
  } else {                                        // 動画=base64化せずFile保持(大容量はtusで直送)
    pendingFile={name:f.name, isImage:false, file:f};
    if(!uploaderOn){uploaderOn=true;renderTools();}
    renderFile();
  }
}

async function uploaderFlow(file, hint){
  el('user').textContent='🎬 '+file.name+(hint?(' — 「'+hint+'」'):'');
  const b=el('bot'); b.classList.add('cursor');
  let res; try{ res=await apiPost('/api/uploader/resolve',{filename:file.name,data_b64:file.b64,hint:hint}); }catch(e){ res={error:e.message}; }
  b.classList.remove('cursor');
  if(res.error){ b.textContent='[失敗] '+res.error; return; }
  const card=document.createElement('div'); card.className='md';
  let html='<div class="ulcard">';
  if(res.recognized) html+='<div style="color:var(--mut);font-size:12px;margin-bottom:6px">👁 認識: '+esc(res.recognized).slice(0,200)+'</div>';
  card.innerHTML=html; b.appendChild(card);
  const box=card.querySelector('.ulcard');
  const useArea=document.createElement('div');                 // 用途選択
  const optWrap=document.createElement('div');                 // 候補リスト専用エリア
  const ccArea=document.createElement('div'); ccArea.className='ccarea';   // クロスチェック/保存 専用(複製防止)
  box.appendChild(useArea); box.appendChild(optWrap); box.appendChild(ccArea);
  let selected=null;
  function selOpt(btn, c){ optWrap.querySelectorAll('.ulopt').forEach(x=>x.classList.remove('sel')); btn.classList.add('sel'); selected=c; openCross(ccArea, c, file, hint); }
  function showTaskPicker(){
    optWrap.innerHTML='<div style="margin:6px 0"><b>提出先タスクを選んでください</b>'+(res.parsed&&res.parsed.cut!=null?(' <span style="color:var(--mut)">(ヒント: cut'+res.parsed.cut+')</span>'):'')+'</div>';
    (res.candidates||[]).forEach(c=>{
      const bt=document.createElement('button'); bt.className='ulopt';
      bt.innerHTML='<b>'+esc(c.name)+'</b> <span style="color:var(--mut)">'+esc(c.project||'')+' / '+esc(c.status||'')+' / '+esc(c.due||'')+(c.shotID?(' / '+esc(c.shotID)):'')+'</span>'+(c.why&&c.why.length?(' ✅'+c.why.join(',')):'');
      bt.onclick=()=>selOpt(bt, c); optWrap.appendChild(bt);
    });
    const other=document.createElement('button'); other.className='ulopt'; other.textContent='その他 / 該当なし（ここに記入）';
    other.onclick=()=>{ optWrap.querySelectorAll('.ulopt').forEach(x=>x.classList.remove('sel')); other.classList.add('sel'); selected=null;
      ccArea.innerHTML='<div style="margin-top:10px"><b>📝 該当タスクを記入</b><input class="ulfree" placeholder="例: marukome c12 アニメ" style="width:100%;box-sizing:border-box;background:rgba(255,255,255,.04);border:1px solid #243049;color:#dbe4ee;border-radius:9px;padding:8px 11px;font-size:13px;margin-top:4px"><button class="ulsubmit">この内容で 提出（確認）</button></div>';
      const inq=ccArea.querySelector('.ulfree'); ccArea.querySelector('.ulsubmit').onclick=()=>doSubmit(ccArea,{id:null,name:inq.value||'(記入)'},file,(hint?hint+' ':'')+inq.value,'qc'); inq.focus();
    };
    optWrap.appendChild(other);
  }
  // 用途選択(まずここから)
  useArea.innerHTML='<div style="margin:4px 0"><b>この投入物の用途は?</b></div>';
  [['qc','🎬 成果物(QC/Review提出)','提出先タスクを選びクロスチェック→Calendar(権限待ち)'],
   ['daily','🗂 daily / メモ(記録だけ)','右脳vaultに即記録(権限不要)'],
   ['reference','📚 リファレンス(参考資料)','紐付け先を選んでCalendar(権限待ち)']].forEach(([v,label,desc])=>{
    const bt=document.createElement('button'); bt.className='ulopt';
    bt.innerHTML='<b>'+label+'</b> <span style="color:var(--mut);font-size:12px">'+desc+'</span>';
    bt.onclick=()=>{
      useArea.querySelectorAll('.ulopt').forEach(x=>x.classList.remove('sel')); bt.classList.add('sel');
      optWrap.innerHTML=''; ccArea.innerHTML='';
      if(v==='daily'){
        ccArea.innerHTML='<div style="margin-top:8px"><b>🗂 daily/メモとして記録</b><input class="ulfree" placeholder="メモ(任意): 何の作業か等" style="width:100%;box-sizing:border-box;background:rgba(255,255,255,.04);border:1px solid #243049;color:#dbe4ee;border-radius:9px;padding:8px 11px;font-size:13px;margin-top:4px" value="'+esc(hint||'')+'"><button class="ulsubmit">vaultに記録</button></div>';
        const inq=ccArea.querySelector('.ulfree'); ccArea.querySelector('.ulsubmit').onclick=()=>doSubmit(ccArea,{id:null,name:file.name},file,inq.value,'daily',res.recognized); inq.focus();
      } else { showTaskPicker(); }
    };
    useArea.appendChild(bt);
  });
  log.scrollTop=log.scrollHeight;
}
async function openCross(ccArea, c, file, hint){
  ccArea.innerHTML='<div style="margin-top:10px;color:var(--mut)">🔍 クロスチェック中…</div>';
  let cc; try{ cc=await apiPost('/api/uploader/crosscheck',{task_id:c.id,hint:hint}); }catch(e){ cc={questions:[]}; }
  let h='<div style="margin-top:10px"><b>🔍 クロスチェック（'+esc(c.name)+'）</b></div>';
  if(cc.spec) h+='<div style="color:var(--mut);font-size:12px;margin:4px 0">仕様: '+esc(cc.spec).slice(0,300)+'</div>';
  (cc.questions||[]).forEach((q,i)=>{ h+='<label style="display:block;font-size:13px;margin:3px 0"><input type="checkbox" class="ccq" data-q="'+i+'"> '+esc(q)+'</label>'; });
  h+='<button class="ulsubmit">この内容で QC 提出（確認）</button>';
  ccArea.innerHTML=h;
  ccArea.querySelector('.ulsubmit').onclick=()=>doSubmit(ccArea, c, file, hint, 'qc');
  log.scrollTop=log.scrollHeight;
}
async function doSubmit(ccArea, c, file, note, intent, recognized){
  const r=await apiPost('/api/uploader/submit',{task_id:c.id,intent:intent||'qc',filename:file.name,note:note,recognized:recognized||''});
  ccArea.insertAdjacentHTML('beforeend','<div class="ulcard" style="margin-top:8px">'+(r.written?('✅ '+esc(r.message||'記録しました')):'🟡 '+esc(r.message||'確認のみ（書込権限待ち）'))+'</div>');
  offUploader();
}

function repTypeStep(types, projects){
  let h='<h3>① 何の報告書を作りますか？</h3>';
  h+=types.map(t=>`<button class="repcard" data-rt="${t.key}"><b>${esc(t.label)}</b> <small>— ${esc(t.when)}</small><br><small>型: ${esc(t.framework)}</small></button>`).join('');
  h+='<label>目的（ひとことで）</label><input id="repGoal" placeholder="例: marukomeレンダリング状況の最終報告">';
  h+='<label>対象プロジェクト/出来事（アンカー）</label><input id="repAnchor" list="repPjs" placeholder="例: marukome">';
  h+='<datalist id="repPjs">'+projects.map(p=>`<option value="${esc(p)}">`).join('')+'</datalist>';
  h+='<button class="repbtn" id="repToStruct" disabled>構成を提案 →</button>';
  repbody.innerHTML=h;
  repbody.querySelectorAll('.repcard').forEach(c=>c.onclick=()=>{ repState.rtype=c.dataset.rt; repbody.querySelectorAll('.repcard').forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); document.getElementById('repToStruct').disabled=false; });
  document.getElementById('repToStruct').onclick=async()=>{
    repState.goal=document.getElementById('repGoal').value.trim(); repState.anchor=document.getElementById('repAnchor').value.trim();
    repbody.innerHTML='<div class="reploading">構成とページングを考えています…</div>';
    const r=await jpost('/api/report/structure',{rtype:repState.rtype,goal:repState.goal,anchor:repState.anchor});
    if(!r.ok){ repbody.innerHTML='<div class="reperr">構成提案に失敗: '+esc(r.error||'')+'</div>'; return; }
    repState.structure={pages:r.pages,type:r.type}; repStructStep(r);
  };
}
function repStructStep(r){
  repState.framework=r.framework; repState.structure={pages:r.pages};
  let h='<h3>② Casperの整理術判断</h3>';
  h+='<div class="repadvice">🧭 最適: <b>'+esc(r.framework_label||'')+'</b>'+(r.rationale?('<br><small>'+esc(r.rationale)+'</small>'):'')+'</div>';
  if(r.frameworks&&r.frameworks.length){
    h+='<div class="rephint">別の整理術に変える:</div><div class="repchoices" id="repFwSw">'+r.frameworks.map(f=>`<button class="repopt${f.key===r.framework?' sel':''}" data-fw="${f.key}" title="${esc(f.when||'')}">${esc(f.label)}</button>`).join('')+'</div>';
  }
  h+='<h3>構成（'+esc(r.framework_label||'')+'の枠）</h3>';
  h+=r.pages.map(p=>`<div class="reppage"><b>${esc(p.title)}</b><ul>${p.sections.map(s=>`<li>${esc(s.title)}</li>`).join('')}</ul></div>`).join('');
  h+='<h3>③ 穴だけ教えて下さい（'+esc(r.framework_label||'')+'の枠）</h3>';
  h+=(r.questions||[]).map(q=>{
    if(q.type==='choice'){ return `<label>${esc(q.q)}</label><div class="repchoices" data-qk="${q.key}">`+q.options.map(o=>`<button class="repopt" data-v="${esc(o)}">${esc(o)}</button>`).join('')+'</div>'; }
    return `<label>${esc(q.q)}</label><input class="repq" data-qk="${q.key}" placeholder="（任意・空欄可）">`;
  }).join('');
  h+='<h3>④ データ源を添付（任意）</h3>';
  h+='<div class="rephint">PPT / Excel / Word / PDF / 図・画像を添付すると、その中身を読み取って報告書に反映します。</div>';
  h+='<input type="file" id="repSrcFile" multiple accept=".pptx,.docx,.xlsx,.pdf,.html,.htm,.csv,.txt,.md,.png,.jpg,.jpeg,.gif,.webp,.bmp" style="font-size:12px">';
  h+='<div id="repSrcList" style="font-size:12px;color:var(--mut);margin-top:6px"></div>';
  h+='<button class="repbtn" id="repGen">第一稿を作る →</button>';
  repbody.innerHTML=h;
  if(!repState.sources) repState.sources=[];
  const srcList=document.getElementById('repSrcList');
  const renderSrc=()=>{ srcList.innerHTML=repState.sources.length?('📎 '+repState.sources.map(s=>esc(s.filename)).join(' / ')):''; };
  renderSrc();
  document.getElementById('repSrcFile').onchange=e=>{
    [...e.target.files].forEach(f=>{ const rd=new FileReader();
      rd.onload=()=>{ repState.sources.push({filename:f.name,data_b64:rd.result}); renderSrc(); };
      rd.readAsDataURL(f); });
    e.target.value='';
  };
  const sw=document.getElementById('repFwSw');
  if(sw) sw.querySelectorAll('.repopt').forEach(b=>b.onclick=async()=>{
    repbody.innerHTML='<div class="reploading">整理術を「'+esc(b.textContent)+'」に変えて組み直しています…</div>';
    const rr=await jpost('/api/report/structure',{rtype:repState.rtype,goal:repState.goal,anchor:repState.anchor,framework:b.dataset.fw});
    if(rr.ok) repStructStep(rr); else repbody.innerHTML='<div class="reperr">切替失敗</div>';
  });
  repbody.querySelectorAll('.repchoices[data-qk]').forEach(g=>g.querySelectorAll('.repopt').forEach(b=>b.onclick=()=>{ g.querySelectorAll('.repopt').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); }));
  document.getElementById('repGen').onclick=async()=>{
    const answers={};
    repbody.querySelectorAll('.repq').forEach(i=>{ if(i.value.trim()) answers[i.dataset.qk]=i.value.trim(); });
    repbody.querySelectorAll('.repchoices[data-qk]').forEach(g=>{ const s=g.querySelector('.repopt.sel'); if(s) answers[g.dataset.qk]=s.dataset.v; });
    repState.answers=answers;
    const nsrc=(repState.sources||[]).length;
    repbody.innerHTML='<div class="reploading">第一稿を生成しています…'+(nsrc?('（添付'+nsrc+'件を読取中）'):'（数十秒お待ちを）')+'</div>';
    const r2=await jpost('/api/report/draft',{rtype:repState.rtype,anchor:repState.anchor,structure:repState.structure,answers:answers,sources:repState.sources||[]});
    if(!r2.ok){ repbody.innerHTML='<div class="reperr">生成失敗: '+esc(r2.error||'')+'</div>'; return; }
    repState.doc_id=r2.doc_id; repState.html=r2.html; repState.url=r2.url; repState.title=r2.title; repPreviewStep();
  };
}
function repPreviewStep(){
  let h='<div class="rephd">📄 '+esc(repState.title||'報告書')+' <a href="'+repState.url+'" target="_blank">↗ Aurora</a></div>';
  h+='<div class="rephint">ブロックをクリック→その場で編集。画像はここにドロップで挿入。終えたら保存。</div>';
  h+='<div id="reppreview"></div>';
  h+='<button class="repbtn" id="repSave">💾 保存（新版）</button> <span id="repSaveMsg" style="font-size:12px;color:var(--mut)"></span><br>';
  h+='<button class="repbtn" id="repNew" style="border-color:#243049">＋ 別の報告書</button>';
  repbody.innerHTML=h;
  const doc=new DOMParser().parseFromString(repState.html,'text/html');
  const wrap=doc.querySelector('.wrap'); repState._doc=doc; repState._wrap=wrap;
  const prev=document.getElementById('reppreview');
  prev.innerHTML = wrap ? wrap.innerHTML : repState.html;
  repWireEdit(prev); repWireDrop(prev);
  document.getElementById('repSave').onclick=async()=>{
    if(repState._wrap){ repState._wrap.innerHTML=prev.innerHTML; repState.html='<!DOCTYPE html>'+doc.documentElement.outerHTML; }
    const msg=document.getElementById('repSaveMsg'); msg.textContent='保存中…';
    const r=await jpost('/api/report/save',{doc_id:repState.doc_id,html:repState.html});
    msg.textContent = r.ok ? ('✅ 保存しました（v'+(r.version||'?')+'）') : ('⚠️ '+(r.error||'失敗'));
  };
  document.getElementById('repNew').onclick=openReport;
}
function repWireEdit(root){
  root.querySelectorAll('.rblk').forEach(el=>{
    el.onclick=()=>{ if(el.getAttribute('contenteditable')==='true') return; el.setAttribute('contenteditable','true'); el.classList.add('repediting'); el.focus(); };
    el.onblur=()=>{ el.removeAttribute('contenteditable'); el.classList.remove('repediting'); };
  });
}
function repWireDrop(root){
  root.addEventListener('dragover',e=>{ e.preventDefault(); root.classList.add('drag'); });
  root.addEventListener('dragleave',()=>root.classList.remove('drag'));
  root.addEventListener('drop',e=>{
    e.preventDefault(); root.classList.remove('drag');
    const f=(e.dataTransfer.files||[])[0]; if(!f||!f.type.startsWith('image/')) return;
    if(f.size>500*1024){ alert('画像が大きいです（500KB以内を推奨）'); return; }
    const rd=new FileReader();
    rd.onload=()=>{ const img=document.createElement('img'); img.src=rd.result; img.style.maxWidth='100%'; img.alt=f.name;
      const tgt=e.target.closest('.rblk'); if(tgt&&tgt.parentNode){ tgt.parentNode.insertBefore(img,tgt.nextSibling);} else { root.appendChild(img);} };
    rd.readAsDataURL(f);
  });
}
</script>
